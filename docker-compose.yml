services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: osp
      POSTGRES_PASSWORD: osp
      POSTGRES_DB: medianet_ospinsight
    volumes:
      - ospdata:/var/lib/postgresql/data
    restart: unless-stopped
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://osp:osp@db:5432/medianet_ospinsight
      JWT_SECRET: ${JWT_SECRET:-medianet-ospinsight-office}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      SEED_USER: ${SEED_USER:-Medianet_Edit}
      SEED_PASSWORD: ${SEED_PASSWORD}
    volumes:
      - ./data:/app/data
    depends_on:
      - db
    restart: unless-stopped
volumes:
  ospdata:
